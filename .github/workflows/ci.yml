name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reality
          POSTGRES_USER: reality
          POSTGRES_PASSWORD: reality-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U reality -d reality"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://reality:reality-ci-only@localhost:5432/reality
      CHATGPT_REGISTRATION_PATH: ${{ runner.temp }}/isolated-session.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -v
      - run: ruff check .
      - run: mypy app ui
      - run: python -m pip_audit --require-hashes --no-deps -r requirements-dev.lock
      - run: alembic upgrade head
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
  windows-session:
    runs-on: windows-latest
    env:
      CHATGPT_REGISTRATION_PATH: ${{ runner.temp }}\isolated-session.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -v tests/test_session_store.py
